# Generated by isoloom from isoloom.yml. Don't edit: change isoloom.yml and run
# `isoloom generate`. `isoloom check` fails when this file is out of date.
# Start:  docker compose -f .isoloom/docker/compose.yml up -d --wait
# Checks: isothrum check . (or: docker compose -f .isoloom/docker/compose.yml --profile check run --rm isoloom-check, and isoloom-check-<machine>)
# Stop:   docker compose -f .isoloom/docker/compose.yml down -v
# Secrets and inputs, delivered as files: set CTF_FLAG_MAIN for `up` (each value, never in the file).

name: skf-lfi
services:
  web:
    build:
      context: ../../app
      dockerfile: Dockerfile.ctf
      labels:
        isoloom.managed: 'true'
        isoloom.environment: skf-lfi
    image: isoloom/skf-lfi-web
    platform: linux/amd64
    hostname: web
    networks:
      lab:
        ipv4_address: 10.60.141.10
    ports:
    - ${ISOLOOM_PUBLISH_ADDRESS:-127.0.0.1}:${ISOLOOM_PUBLISH_FIXED:+5050}:5000
    volumes:
    - web-ctf:/ctf
    - isoloom-probe-amd64:/.isoloom-probe:ro
    secrets:
    - source: input-ctf-flag-main
      target: /run/lab/ctf_flag_main
      mode: '0400'
    healthcheck:
      test:
      - CMD
      - /.isoloom-probe/busybox
      - sh
      - -c
      - /.isoloom-probe/busybox nc -z -w 2 127.0.0.1 5000
      interval: 5s
      timeout: 3s
      retries: 60
      start_period: 10s
    depends_on:
      isoloom-probe-amd64:
        condition: service_completed_successfully
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 256M
    labels:
      isoloom.port.web: http:5000
      isoloom.managed: 'true'
      isoloom.environment: skf-lfi
    restart: unless-stopped
  web-routes:
    image: alpine:3.20
    init: true
    entrypoint:
    - /bin/sh
    - -c
    - (ip route del default 2>/dev/null || true) && while ip -o -4 addr show | grep -qv ' lo '; do sleep 2; done; exit 1
    network_mode: service:web
    cap_add:
    - NET_ADMIN
    healthcheck:
      test:
      - CMD-SHELL
      - '! ip route | grep -q ''^default'''
      interval: 2s
      timeout: 2s
      retries: 30
    depends_on:
      web:
        condition: service_started
    labels:
      isoloom.managed: 'true'
      isoloom.environment: skf-lfi
    restart: unless-stopped
  web-init-1:
    image: isoloom/skf-lfi-web
    user: root
    entrypoint:
    - /bin/sh
    - /isoloom/init/flag.sh
    network_mode: service:web
    volumes:
    - ../../ctf/flag.sh:/isoloom/init/flag.sh:ro
    - web-ctf:/ctf
    secrets:
    - source: input-ctf-flag-main
      target: /run/lab/ctf_flag_main
      mode: '0400'
    depends_on:
      web:
        condition: service_healthy
      web-routes:
        condition: service_healthy
    labels:
      isoloom.managed: 'true'
      isoloom.environment: skf-lfi
    restart: no
  isoloom-check:
    image: curlimages/curl:8.11.1
    profiles:
    - check
    user: '0'
    entrypoint:
    - /bin/sh
    - -c
    - ip route del default 2>/dev/null; exec sh /isoloom/run.sh
    networks:
      lab: null
    cap_add:
    - NET_ADMIN
    volumes:
    - ./checks/networks.sh:/isoloom/run.sh:ro
    - ../..:/isoloom/project:ro
    depends_on:
      web:
        condition: service_healthy
      web-init-1:
        condition: service_completed_successfully
      web-routes:
        condition: service_healthy
    labels:
      isoloom.managed: 'true'
      isoloom.environment: skf-lfi
  isoloom-check-web:
    image: curlimages/curl:8.11.1
    profiles:
    - check
    entrypoint:
    - /bin/sh
    - /isoloom/run.sh
    network_mode: service:web
    volumes:
    - ./checks/web.sh:/isoloom/run.sh:ro
    depends_on:
      web:
        condition: service_healthy
      web-init-1:
        condition: service_completed_successfully
      web-routes:
        condition: service_healthy
    labels:
      isoloom.managed: 'true'
      isoloom.environment: skf-lfi
  isoloom-probe-amd64:
    image: busybox:1.37.0-musl
    platform: linux/amd64
    entrypoint:
    - /bin/cp
    - /bin/busybox
    - /probe/busybox
    network_mode: none
    volumes:
    - isoloom-probe-amd64:/probe
    labels:
      isoloom.managed: 'true'
      isoloom.environment: skf-lfi
    restart: no
networks:
  lab:
    ipam:
      config:
      - subnet: 10.60.141.0/24
        gateway: 10.60.141.1
    labels:
      isoloom.managed: 'true'
      isoloom.environment: skf-lfi
volumes:
  web-ctf:
    labels:
      isoloom.managed: 'true'
      isoloom.environment: skf-lfi
  isoloom-probe-amd64:
    labels:
      isoloom.managed: 'true'
      isoloom.environment: skf-lfi
secrets:
  input-ctf-flag-main:
    environment: CTF_FLAG_MAIN
