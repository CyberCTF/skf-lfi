# yaml-language-server: $schema=https://www.isoloom.com/schema/v1.json
# OWASP SKF Local File Inclusion (OWASP Security Knowledge Framework labs, by Glenn ten Cate, Riccardo ten Cate and the SKF contributors) as an Isoloom spec:
# a Flask page that opens and displays whatever file name the form sends (local file inclusion / path traversal). The SKF lab folder python/LFI is
# vendored unchanged in app/ and built by its own Dockerfile through an overlay
# (app/Dockerfile.ctf) that adds the flag folder /ctf.
# `isoloom generate`, then `isoloom run docker`.
version: 1
name: skf-lfi

# Given by the CyberCTF launcher: this player's flag. Without it the development flag.
inputs: [CTF_FLAG_MAIN]

networks:
  lab: { cidr: 10.60.141.0/24, internet: false }

machines:
  web:
    networks: { lab: 10 }
    ports: { web: { port: 5000, protocol: http, publish: 5050 } }
    resources: { cpus: 1, memory_mb: 256 }
    files:
      - path: /run/lab/ctf_flag_main
        input: CTF_FLAG_MAIN
    volumes: { ctf: /ctf }   # the flag, written by ctf/flag.sh at every start
    setup:
      - ctf/flag.sh
    app:
      build:
        context: app
        dockerfile: app/Dockerfile.ctf

checks:
  - name: the lab answers
    http: http://web:5000/
    wait: 120
  - name: the default text file is read through the filename parameter
    script: checks/read.sh

message: |
  OWASP SKF Local File Inclusion answers at http://localhost:{{ machines.web.ports.web.published }}/.
  The drop-down sends a file name to /home, and the server opens it.
